server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Docker's embedded DNS. Using a variable upstream forces nginx to resolve
    # `api` at request time (not at config load), so the container boots even if
    # the API isn't up yet and survives API restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the API container (compose service `api`, port 8080).
    # proxy_pass with a variable + no URI preserves the full /api/... path
    # (the API expects /api/v2/...).
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # (Custom headers like X-Dev-Claims are forwarded by default.)
    }

    # SPA client-side routing: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
