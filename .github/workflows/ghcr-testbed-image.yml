name: Build & push testbed image (GHCR)

# Publishes the dev-auth TESTBED image of the product SPA to GitHub Container
# Registry, consumed by cps-dotnet/docker-compose.testbed.yml. Static build
# served by nginx (proxies /api → the API container).
#
# After the first run, make the GHCR package PUBLIC so the test box can pull
# without authenticating.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker/**'
      - 'package*.json'
      - '.github/workflows/ghcr-testbed-image.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/vijayyadav-arch/cps-spa:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
